services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql_course_server
    restart: always
    environment:
      # Automatically reads the password from .env file
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_course_data:/var/lib/mysql

volumes:
  mysql_course_data:
